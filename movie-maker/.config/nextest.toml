# cargo-nextest の設定。CI の使い方と揺れるテストの隔離は docs/ci.md の「揺れるテストの隔離」。
# nextest はテストを 1 つずつ別のプロセスで実行する。同じプロセスで wgpu のデバイスを並列に作る衝突が起きない。

# 手元は再試行しない。揺れを隠さず、その場で見えるようにする。
[profile.default]
retries = 0
slow-timeout = { period = "60s" }

# CI。失敗は 2 回まで再試行し、再試行で通ったテストを JUnit の flakyFailure で残す（scripts/nextest-ci.sh が読む）。
[profile.ci]
retries = { backoff = "fixed", count = 2, delay = "1s" }
fail-fast = false
failure-output = "immediate-final"
# 止まったテスト（CEF や GPU の待ち）を 10 分で打ち切り、ジョブの期限まで待たずに JUnit と揺れの記録を残す。
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

# 隔離したテストだけを回す。結果はゲートにせず、JUnit を記録に残す。
[profile.quarantine]
retries = 0
fail-fast = false
failure-output = "final"
slow-timeout = { period = "60s" }

[profile.quarantine.junit]
path = "junit-quarantine.xml"

# CEF のホストは 1 つで数百 MB と複数のプロセスを使う。CPU が詰まると Prepare や起動の Ping が時間切れになるので、
# CEF を起こすテストの同時の数を絞る（nextest の test-groups。profile を継ぐ設定の overrides は default のものが全部に効く）。
[test-groups.cef-host]
max-threads = 2

[[profile.default.overrides]]
filter = "package(mm-host-cef) | package(mm-nodes-cef) | package(mm-text-cef)"
test-group = "cef-host"

# GPU でデコードするテストは 4K の素材で VRAM と CUDA のコンテキストを使う。ワークスペース全体を回すと
# 「CUDA のデバイスを開けない」「Not enough memory left」でデコーダーが作れないことがあるので、同時の数を絞る。
[test-groups.gpu-decode]
max-threads = 2

[[profile.default.overrides]]
filter = "package(mm-decode-cuvid) | package(mm-decode-d3d12va)"
test-group = "gpu-decode"
