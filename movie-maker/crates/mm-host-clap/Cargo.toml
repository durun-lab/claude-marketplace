[package]
name = "mm-host-clap"
description = "CLAP の音のプラグインを別プロセスで読み込み、音のブロックを共有メモリで往復させるホストと、音の効果の種類 audio.clap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-audio-api = { workspace = true }
mm-host-api = { workspace = true }
mm-host-pipe = { workspace = true }
mm-node-api = { workspace = true }
mm-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clack-host = { workspace = true }
clack-extensions = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
] }

[build-dependencies]
cc = { workspace = true }

[lints]
workspace = true
