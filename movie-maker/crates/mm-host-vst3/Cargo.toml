[package]
name = "mm-host-vst3"
description = "VST3 の音のプラグインを別プロセスで読み込み、音のブロックを共有メモリで往復させるホストと、音の効果の種類 audio.vst3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-host-pipe = { workspace = true }
mm-types = { workspace = true }
serde_json = { workspace = true }
libloading = { workspace = true }
vst3 = { workspace = true }

[dev-dependencies]
mm-audio-api = { workspace = true }
mm-host-api = { workspace = true }
mm-node-api = { workspace = true }
tempfile = { workspace = true }

# テストのプラグイン（gain と 1 サンプルの遅延）。`cargo test` が例と一緒に作り、tests/it/ がバンドルの形に置いて読む。
[[example]]
name = "mm_vst3_test"
path = "tests/plugins/mm_vst3_test.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
